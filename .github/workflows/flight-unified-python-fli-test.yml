name: FLIGHT-1 Python FLI alternate one-off probe
on:
  push:
    branches:
      - jc-savage/flight-unified-pilot-20261030
    paths:
      - .github/workflows/flight-unified-python-fli-test.yml
permissions:
  contents: read
jobs:
  python-fli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned original FLI Python implementation
        run: |
          python -m pip install --quiet "git+https://github.com/jshonuff/fli.git@62eaaed9925c6ea63a606ccdbb74be3040e45d66"
      - name: Check one generic route, redacted output
        run: |
          python - <<'PY'
          import json
          stage="IMPORT"
          try:
              from fli.models import Airport, PassengerInfo, SeatType, MaxStops, SortBy, FlightSearchFilters, FlightSegment
              from fli.search import SearchFlights
              stage="FILTER"
              f=FlightSearchFilters(
                  passenger_info=PassengerInfo(adults=1),
                  flight_segments=[FlightSegment(departure_airport=[[Airport.DEN,0]],
                     arrival_airport=[[Airport.LAS,0]],travel_date="2026-11-01")],
                  seat_type=SeatType.ECONOMY,stops=MaxStops.NON_STOP,sort_by=SortBy.CHEAPEST)
              stage="LIVE_FETCH"
              result=SearchFlights().search(f)
              print(json.dumps({"provider":"fli_python","stage":stage,
                    "status":"RETRIEVED" if result else "EMPTY_OR_NULL","count":len(result or [])}))
          except Exception as e:
              print(json.dumps({"provider":"fli_python","stage":stage,"status":"ERROR",
                 "errorType":type(e).__name__}))
          PY
